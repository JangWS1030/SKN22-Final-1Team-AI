name: Build and Push RunPod Diag Image

on:
  push:
    branches:
      - main
      - master
      - develop
      - develop/**
      - LBJ/**
    paths:
      - "Dockerfile.runpod.diag"
      - "handler_runpod_diag.py"
      - ".github/workflows/build-runpod-diag.yml"
  workflow_dispatch:

concurrency:
  group: build-runpod-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Validate Docker Hub secrets
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "${DOCKER_USERNAME}" ] || [ -z "${DOCKER_PASSWORD}" ]; then
            echo "::error::DOCKER_USERNAME and DOCKER_PASSWORD secrets are required."
            exit 1
          fi

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

      - name: Build and push diag image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runpod.diag
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          cache-from: type=gha,scope=runpod-diag
          cache-to: type=gha,mode=max,scope=runpod-diag
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sd:diag-run-${{ github.run_number }}
            ${{ secrets.DOCKER_USERNAME }}/sd:diag-latest
